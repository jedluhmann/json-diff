name: Publish to npm and GitHub Packages with Bun

on:
  push:
    tags:
      - "v*" # Triggers the workflow when you push a tag like v1.0.4

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Required for Trusted Publishing / OIDC
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Update npm to latest
        # Critical for reliable OIDC Trusted Publishing handshakes
        run: npm install -g npm@latest

      - name: Install dependencies
        # --ignore-scripts prevents Husky from running during installation
        run: npm install --ignore-scripts --legacy-peer-deps

      - name: Run tests
        run: npm test
        env:
          FORCE_COLOR: "1"  # Forces color support detection in headless CI environments

      - name: Remove husky before publish
        # Bypasses Husky during the publish phase since we don't need it in CI
        run: npm pkg delete scripts.prepare

      - name: Publish to npm
        run: npm publish --registry=https://registry.npmjs.org --provenance --access public

      - name: Publish to GitHub Packages
        # Passes the token inline, stripping out the error-prone .npmrc generation
        run: npm publish --registry=https://npm.pkg.github.com/ --//://github.com{{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Automatically provided by GitHub
        run: |
          gh release create ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --title "${{ github.ref_name }}" \
            --generate-notes
