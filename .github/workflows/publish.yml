name: Publish to npm and GitHub Packages with Bun

on:
  push:
    tags:
      - "v*" # Triggers the workflow when you push a tag like v1.0.4

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Required for Trusted Publishing / OIDC
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Bun instead of Node/npm
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run tests
        env:
          FORCE_COLOR: "1"  # Forces color support detection in headless CI environments
        run: bun test

      - name: Remove husky before publish
        run: bun pm pkg delete scripts.prepare

      - name: Update npm to latest
        # Update to latest for reliable OIDC Trusted Publishing handshakes
        run: npm install -g npm@latest

      # Using github as a trusted publisher
      - name: Publish to npm
        run: npm publish --registry=https://registry.npmjs.org --provenance --access public

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun publish --registry=https://npm.pkg.github.com

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Automatically provided by GitHub
        run: |
          gh release create ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --title "${{ github.ref_name }}" \
            --generate-notes
